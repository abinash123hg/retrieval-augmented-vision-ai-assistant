services:
  backend:
    build:
      context: ./backend
    container_name: doculens-backend
    env_file:
      - ./backend/.env
    environment:
      # Ollama runs on the host; reach it via host.docker.internal
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/data:/app/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: node:20-alpine
    container_name: doculens-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
