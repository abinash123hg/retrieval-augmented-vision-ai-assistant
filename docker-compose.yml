services:
  backend:
    build:
      context: ./backend
    container_name: doculens-backend
    env_file:
      - ./backend/.env
    environment:
      # Ollama runs on the host; reach it via host.docker.internal
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/data:/app/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The backend also serves the plain HTML/CSS/JS UI (app/static) at http://localhost:8000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
